server:
  port: ${PORT:8088}

spring:
  application:
    name: flowcast
  datasource:
    url: ${FLOWCAST_DB_URL:jdbc:postgresql://localhost:5432/flowcast}
    username: ${FLOWCAST_DB_USERNAME:flowcast}
    password: ${FLOWCAST_DB_PASSWORD:change-me}
  flyway:
    enabled: ${FLOWCAST_FLYWAY_ENABLED:false}
  thymeleaf:
    cache: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
flowcast:
  tomtom-server-key: ${FLOWCAST_TOMTOM_SERVER_KEY:}
  tomtom-browser-key: ${FLOWCAST_TOMTOM_BROWSER_KEY:}
  tomtom-search-key: ${FLOWCAST_TOMTOM_SEARCH_KEY:}
  open-meteo-enabled: ${FLOWCAST_OPEN_METEO_ENABLED:true}
  traffic-history-enabled: ${FLOWCAST_TRAFFIC_HISTORY_ENABLED:false}
  traffic-training-permission: ${FLOWCAST_TRAFFIC_TRAINING_PERMISSION:false}
  latitude: ${FLOWCAST_LATITUDE:17.6868}
  longitude: ${FLOWCAST_LONGITUDE:83.2185}
  location-name: ${FLOWCAST_LOCATION_NAME:Visakhapatnam, Andhra Pradesh}
